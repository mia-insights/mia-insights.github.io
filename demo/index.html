<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démonstration · Mia Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/viz.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app">

  <aside class="side">
    <a class="brand" href="#apercu">
      <span data-mark=""></span>
      <span><b>Mia Insights</b><span>démonstration</span></span>
    </a>
    <nav id="menu"></nav>
    <div class="foot">
      <a class="retour" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>
        </svg>
        Retour au site
      </a>
      <p><b>Données fictives</b>
      Aucun chiffre de cette application ne décrit un assureur réel.</p>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      <h1 id="titre">Vue d’ensemble</h1>
      <span class="sep" id="sep2"></span>
      <div class="filters" id="filtres">
        <select id="f-periode" aria-label="Période">
          <option value="8">8 trimestres</option>
          <option value="12" selected>12 trimestres</option>
          <option value="16">16 trimestres</option>
        </select>
        <select id="f-branche" aria-label="Branche">
          <option value="*" selected>Toutes les branches</option>
          <option value="auto">Automobile</option>
          <option value="hab">Habitation</option>
          <option value="sante">Santé</option>
          <option value="prev">Prévoyance</option>
          <option value="rc">Responsabilité civile</option>
        </select>
        <select id="f-reseau" aria-label="Réseau">
          <option value="*" selected>Tous les réseaux</option>
          <option value="agents">Agents</option>
          <option value="courtiers">Courtiers</option>
          <option value="direct">Direct et espace client</option>
        </select>
      </div>
      <span class="stamp" id="stamp"></span>
      <button class="ask" id="ask" title="Afficher ou masquer Mia">
        <span data-mark="s"></span><span>Mia</span>
      </button>
    </header>

    <div class="tabs hidden" id="tabs"></div>
    <main class="view zone" id="vue"></main>
  </div>

  <aside class="mia" id="mia" aria-label="Mia, l’assistante d’analyse">
    <div class="hd">
      <span data-mark=""></span>
      <div>
        <b>Mia</b>
        <div class="sub">Elle écrit le code, l’exécute, et construit le miabord</div>
      </div>
      <button class="x" id="closemia" aria-label="Masquer Mia">&times;</button>
    </div>
    <div class="body" id="miabody"></div>
    <div class="ft">
      <form class="row" id="form" autocomplete="off">
        <input type="text" id="q" placeholder="Demandez un miabord, ou une modification">
        <button class="send" type="submit">Envoyer</button>
      </form>
      <div class="chips" id="chips"></div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim"></div>

<script src="../assets/viz.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
